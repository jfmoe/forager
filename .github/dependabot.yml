version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # Major versions stay out of the group, so each opens its own pull request and a breaking
    # bump cannot hold back the compatible updates.
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # reqwest 0.13 trades the bundled certificate roots for the system trust store and ring for
      # aws-lc, which the offline tests cannot prove, so forager stays on 0.12.
      - dependency-name: reqwest
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

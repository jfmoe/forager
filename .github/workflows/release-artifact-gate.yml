name: Release artifact gate

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      unix-matrix: ${{ steps.targets.outputs.unix-matrix }}
      windows-matrix: ${{ steps.targets.outputs.windows-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: targets
        run: bash .github/scripts/prepare-release-targets.sh .github/release-targets.json "$GITHUB_OUTPUT"

  verify-checksums:
    needs: prepare-targets
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download draft Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ inputs.plan }}
          TARGETS: ${{ needs.prepare-targets.outputs.targets }}
        run: |
          tag=$(jq -r '.announcement_tag' <<< "$PLAN")
          mkdir artifacts
          while IFS=$'\t' read -r target archive; do
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "forager-$target.$archive" \
              --pattern "forager-$target.$archive.sha256" \
              --dir artifacts
          done < <(jq -r '.[] | [.target, .archive] | @tsv' <<< "$TARGETS")
      - name: Verify archive checksums
        working-directory: artifacts
        env:
          TARGETS: ${{ needs.prepare-targets.outputs.targets }}
        run: |
          checksum_count=$(find . -type f -name '*.sha256' | wc -l | tr -d ' ')
          test "$checksum_count" -eq "$(jq 'length' <<< "$TARGETS")"
          find . -type f -name '*.sha256' -print0 |
            while IFS= read -r -d '' checksum; do
              sha256sum --check "$checksum"
            done

  verify-unix:
    needs:
      - prepare-targets
      - verify-checksums
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-targets.outputs.unix-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Download draft Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          tag=$(jq -r '.announcement_tag' <<< "$PLAN")
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "forager-$TARGET.$ARCHIVE" \
            --dir artifacts
      - name: Verify installed binary
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
          HOST_ARCH: ${{ matrix.host_arch }}
          FILE_ARCH: ${{ matrix.file_arch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version=$(jq -r '.releases[0].app_version' <<< "$PLAN")
          install_dir="$RUNNER_TEMP/forager-release"
          config_dir="$RUNNER_TEMP/forager-config"
          state_dir="$RUNNER_TEMP/forager-state"
          home_dir="$RUNNER_TEMP/forager-home"
          mkdir -p "$install_dir" "$state_dir" "$home_dir"
          install -d -m 700 "$config_dir"
          tar -xJf "artifacts/forager-$TARGET.$ARCHIVE" -C "$install_dir"
          binary=$(find "$install_dir" -type f -name forager -print -quit)
          test -n "$binary"
          test -x "$binary"
          test "$(uname -m)" = "$HOST_ARCH"
          file "$binary" | grep -F "$FILE_ARCH"
          binary_dir=$(dirname "$binary")
          PATH="$binary_dir:$PATH"
          export PATH
          test "$(command -v forager)" = "$binary"
          test "$(forager --version)" = "forager $version"
          printf '%s\n' \
            '[providers.xai]' \
            'keys = ["release-gate"]' \
            '[providers.openai_compatible]' \
            'url = "https://example.invalid/v1"' \
            'keys = ["release-gate"]' \
            'model = "release-gate"' \
            '[providers.tavily]' \
            'keys = ["release-gate"]' \
            '[providers.firecrawl]' \
            'keys = ["release-gate"]' \
            '[providers.jina]' \
            'keys = ["release-gate"]' \
            '[providers.context7]' \
            'keys = ["release-gate"]' \
            '[providers.exa]' \
            'keys = ["release-gate"]' \
            '[providers.anysearch]' \
            'keys = ["release-gate"]' \
            > "$config_dir/config.toml"
          chmod 600 "$config_dir/config.toml"
          doctor=$(FORAGER_CONFIG_DIR="$config_dir" XDG_STATE_HOME="$state_dir" \
            HOME="$home_dir" forager doctor --timeout 1 || test "$?" -eq 4)
          jq -e '
            .ok == false
            and .mode == "shallow"
            and ([.providers[] | select(.configured)] | length) == 8
            and .config.providers.exa.keys.source == "file"
            and (.permission_warnings | length) == 0
          ' <<< "$doctor"

  verify-windows:
    needs:
      - prepare-targets
      - verify-checksums
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-targets.outputs.windows-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Download draft Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $tag = ($env:PLAN | ConvertFrom-Json).announcement_tag
          gh release download $tag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "forager-$($env:TARGET).$($env:ARCHIVE)" `
            --dir artifacts
      - name: Verify installed binary
        shell: pwsh
        env:
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = ($env:PLAN | ConvertFrom-Json).releases[0].app_version
          $installDir = Join-Path $env:RUNNER_TEMP "forager-release"
          $configDir = Join-Path $env:RUNNER_TEMP "forager-config"
          $stateDir = Join-Path $env:RUNNER_TEMP "forager-state"
          New-Item -ItemType Directory -Force $installDir, $configDir, $stateDir | Out-Null
          Expand-Archive "artifacts/forager-$($env:TARGET).$($env:ARCHIVE)" $installDir
          $binary = Get-ChildItem $installDir -Recurse -File -Filter forager.exe |
            Select-Object -First 1
          if ($null -eq $binary) {
            throw "forager.exe is missing"
          }
          $stream = [System.IO.File]::OpenRead($binary.FullName)
          try {
            $reader = [System.Reflection.PortableExecutable.PEReader]::new($stream)
            $machine = $reader.PEHeaders.CoffHeader.Machine
            if ($machine.ToString() -ne $env:EXPECTED_MACHINE) {
              throw "unexpected PE Machine: $machine"
            }
          } finally {
            $stream.Dispose()
          }
          $env:PATH = "$($binary.DirectoryName);$env:PATH"
          if ((Get-Command forager).Source -ne $binary.FullName) {
            throw "PATH does not resolve the release binary"
          }
          if ((forager --version) -ne "forager $version") {
            throw "release binary version mismatch"
          }
          $config = @'
          [providers.xai]
          keys = ["release-gate"]
          [providers.openai_compatible]
          url = "https://example.invalid/v1"
          keys = ["release-gate"]
          model = "release-gate"
          [providers.tavily]
          keys = ["release-gate"]
          [providers.firecrawl]
          keys = ["release-gate"]
          [providers.jina]
          keys = ["release-gate"]
          [providers.context7]
          keys = ["release-gate"]
          [providers.exa]
          keys = ["release-gate"]
          [providers.anysearch]
          keys = ["release-gate"]
          '@
          Set-Content -Encoding utf8 (Join-Path $configDir "config.toml") $config
          $env:FORAGER_CONFIG_DIR = $configDir
          $env:XDG_STATE_HOME = $stateDir
          $env:HOME = Join-Path $env:RUNNER_TEMP "forager-home"
          $doctorJson = forager doctor --timeout 1
          $doctorExitCode = $LASTEXITCODE
          $doctor = $doctorJson | ConvertFrom-Json
          if ($doctorExitCode -ne 4 -or $doctor.ok -or $doctor.mode -ne "shallow") {
            throw "doctor did not report the expected unreachable configuration"
          }
          $configured = @($doctor.providers | Where-Object configured)
          if ($configured.Count -ne 8) {
            throw "doctor did not load all migrated provider credentials"
          }
          exit 0

  record-gate:
    needs:
      - prepare-targets
      - verify-checksums
      - verify-unix
      - verify-windows
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Record release gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ inputs.plan }}
          TARGETS: ${{ needs.prepare-targets.outputs.targets }}
        run: |
          version=$(jq -r '.releases[0].app_version' <<< "$PLAN")
          tag=$(jq -r '.announcement_tag' <<< "$PLAN")
          jq -n \
            --arg version "$version" \
            --arg tag "$tag" \
            --argjson targets "$TARGETS" \
            --arg shell "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/jfmoe/forager/releases/download/$tag/forager-installer.sh | sh" \
            --arg powershell "powershell -ExecutionPolicy Bypass -c \"irm https://github.com/jfmoe/forager/releases/download/$tag/forager-installer.ps1 | iex\"" \
            '{
              release_version: $version,
              release_tag: $tag,
              result: "passed",
              verified_targets: [$targets[].target],
              install: {shell: $shell, powershell: $powershell}
            }' > release-gate.json
          gh release upload "$tag" release-gate.json --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-release-gate
          path: release-gate.json

name: CI

on:
  pull_request:
    # A pull request that changes only documentation skips CI; pushes to main always run it.
    # Keep every document that a test or build reads included, such as the spec chapters below
    # and everything under skills/.
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!.agents/**"
      - "!.claude/**"
      - "docs/spec/forager/04-architecture.md"
      - "docs/spec/forager/07-platforms.md"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --locked

  windows-permissions:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --test command_watchdog --test config_permissions --test release_artifact_gate --test smoke --locked

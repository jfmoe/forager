name: Scheduled advisory check

# Checks the locked dependencies against the RustSec advisory database.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  report:
    needs:
      - audit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash .github/scripts/report-scheduled-run.sh workflow:scheduled-advisories "Scheduled advisory check fails"

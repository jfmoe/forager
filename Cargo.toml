[package]
name = "forager"
version = "0.21.0"
edition = "2024"
description = "A search and retrieval CLI for AI agents"
repository = "https://github.com/jfmoe/forager"
license = "MIT"

[package.metadata.dist]
dist = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.42", features = ["derive"] }
eventsource-stream = "0.2.3"
fastrand = "2.5.0"
futures-util = "0.3.31"
quick-xml = { version = "0.42.0", features = ["overlapped-lists", "serialize"] }
reqwest = { version = "0.12.22", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rpassword = "7.4.0"
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["unbounded_depth"] }
serde_path_to_error = "0.1.17"
sha2 = "0.11.2"
shared_child = { version = "1.1.1", default-features = false }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.2.3"
toml_edit = "0.23.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32.0", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"

[dev-dependencies]
http = "1.4.2"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.47.1", features = ["test-util"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
redundant_clone = "warn"
missing_const_for_fn = "allow"

# Debug info is off because on macOS it stays in the object files, and every incremental build then
# leaves a new copy of each one in target/debug/deps: 1,476 files per rebuild, measured, and a
# directory of 600,000 files made each build about six times slower. A panic still names its file and
# line; CARGO_PROFILE_DEV_DEBUG=true brings back backtrace lines and debugger variables.
[profile.dev]
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

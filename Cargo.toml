[package]
name = "forager"
version = "0.1.0"
edition = "2024"
description = "A capability-oriented research CLI"
repository = "https://github.com/jfmoe/forager"
license = "MIT"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
thiserror = "2.0.12"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"

[dev-dependencies]
tempfile = "3.20.0"
toml = "0.9.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

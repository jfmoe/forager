[package]
name = "forager"
version = "0.1.1"
edition = "2024"
description = "A capability-oriented research CLI"
repository = "https://github.com/jfmoe/forager"
license = "MIT"

[package.metadata.dist]
dist = true

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
clap = { version = "4.5.42", features = ["derive"] }
eventsource-stream = "0.2.3"
fs2 = "0.4.3"
futures-util = "0.3.31"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_path_to_error = "0.1.17"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "time"] }
toml = "0.9.5"
toml_edit = "0.23.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.20.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "forager"
version = "0.6.0"
edition = "2024"
description = "A capability-oriented research CLI"
repository = "https://github.com/jfmoe/forager"
license = "MIT"

[package.metadata.dist]
dist = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.42", features = ["derive"] }
eventsource-stream = "0.2.3"
fs2 = "0.4.3"
futures-util = "0.3.31"
quick-xml = { version = "0.42.0", features = ["overlapped-lists", "serialize"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_path_to_error = "0.1.17"
shared_child = { version = "1.1.1", default-features = false }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["process", "rt-multi-thread", "sync", "time"] }
toml = "0.9.5"
toml_edit = "0.23.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"

[dev-dependencies]
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["test-util"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
missing_const_for_fn = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

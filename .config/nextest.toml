# The test runner configuration that local checks and CI share.
nextest-version = { required = "0.9.152" }

[profile.default]
# A passing run prints only the summary. A failing run prints each failure's output as it
# happens and ends by naming every failed test, so the end of the output is the list to read.
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"
fail-fast = false
# Above the command deadline the shared test environment gives a spawned binary, so that
# deadline fires first and the test reports what it expected and what it received.
slow-timeout = { period = "30s", terminate-after = 2 }

# The exemption list: command contract tests allowed to wait on production pacing, because no
# operation without a wait proves their rule. Each entry keeps this generous limit when the
# profile's own limit tightens; docs/agents/testing.md says when a test may join.

# Writing fetched content to a directory needs an arXiv full text, which is the metadata request
# and the HTML probe, two paced requests.
[[profile.default.overrides]]
filter = "binary_id(forager::arxiv_fetch) & test(=full_text_fetch_writes_the_body_to_a_file_and_reports_the_resolved_version)"
slow-timeout = { period = "30s", terminate-after = 2 }

# Any successful read through `youtube_web` needs the watch page and the player, two paced
# requests, and YouTube's other routes do not reach it.
[[profile.default.overrides]]
filter = "binary_id(forager::youtube_web_fetch) & test(=an_abstract_fetch_prints_the_video_read_from_its_page_and_player)"
slow-timeout = { period = "30s", terminate-after = 2 }

# A history reads the market from Gamma before its prices from the Data API, two paced requests.
[[profile.default.overrides]]
filter = "binary_id(forager::polymarket_history) & test(=a_history_prints_the_price_series_of_the_market)"
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
retries = 0
fail-fast = false

# For the real-browser tests, which are ignored by default. A profile cannot select ignored
# tests, so the command line passes `--run-ignored only`; docs/agents/browser-routes.md has the
# command.
[profile.real-browser]
# Every ignored test is a real-browser test in the library; with `--run-ignored only` this
# filter selects exactly them. Narrow it when an ignored test of another kind appears.
default-filter = "kind(lib)"
test-threads = 2
slow-timeout = { period = "60s", terminate-after = 3 }
